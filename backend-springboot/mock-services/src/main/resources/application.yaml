spring:
  application:
    name: mock-services

server:
  port: 8091

mocks:
  # How long SLOW mode sleeps before answering normally.
  slow-millis: 15000
  esign:
    webhook-url: ${ESIGN_WEBHOOK_URL:http://localhost:8086/inbound/mcp-esign-callback}
    # Demo default only; set ESIGN_HMAC_SECRET to the same value as the webhook connector.
    hmac-secret: ${ESIGN_HMAC_SECRET:demo-esign-secret}
  # X-Api-Key required by the registry endpoints (installers, grid load, certificates).
  # Empty = no check. The BPMN REST connectors send the Camunda secret MOCKS_API_KEY.
  api-key: ${MOCKS_API_KEY:}
